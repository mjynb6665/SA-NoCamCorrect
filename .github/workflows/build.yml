name: Build NoCamCorrect

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Build with cl.exe
        shell: cmd
        run: |
          set VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe
          for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          echo VSPATH=%VSPATH%
          if "%VSPATH%"=="" exit /b 1
          call "%VSPATH%\VC\Auxiliary\Build\vcvars32.bat" || exit /b 1
          if not exist build mkdir build
          cl.exe /nologo /LD /O2 /MT /GS- /EHsc /DWIN32 /D_WINDOWS /D_USRDLL /Fe:build\NoCamCorrect.asi /Fo:build\ NoCamCorrect.cpp /link /SUBSYSTEM:WINDOWS /MACHINE:X86
          if errorlevel 1 exit /b 1
          dir build\NoCamCorrect.asi

      - name: Upload NoCamCorrect.asi
        uses: actions/upload-artifact@v4
        with:
          name: NoCamCorrect
          path: "build/NoCamCorrect.asi"
