[Settings]

; Set to 0 to disable the plugin entirely without uninstalling it.
Enabled = 1

; 0 = disable the camera spring (WellBufferMe) everywhere.
;     This removes the automatic re-centring in every camera mode.
; 1 = reserved: restrict the same patch to the vehicle camera only.
;     Not implemented yet; falls back to 0 with a log warning.
Mode = 0

; Calling convention of the patched function.
;   cdecl   = use a bare "ret"      (correct for most GTA SA builds)
;   stdcall = use "ret 24"          (try this only if the game crashes on load)
; Only change this if you get a crash right after the plugin loads.
Stub = cdecl
