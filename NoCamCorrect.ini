[Settings]

; Set to 0 to disable the plugin without uninstalling it.
Enabled = 1

; 0 = load but do nothing (safe baseline for A/B testing)
; 1 = zero the two camera spring velocities every frame (no auto-recentre)
Mode = 1

; How often to clamp the spring velocities, in milliseconds.
; 8 ms is roughly one frame at 125 fps. Do not go below 4.
IntervalMs = 8

; ---------------------------------------------------------------------------
; Memory layout, verified against gta-sa.exe 1.0 by disassembly.
; Change these only if the values in NoCamCorrect.log look wrong.
; ---------------------------------------------------------------------------

; Base of the CCam array (TheCamera + 0x180).
CamArrayAddress = 0x00B6F1A8

; Byte holding the index of the active camera (TheCamera + 0x59).
ActiveCamAddress = 0x00B6F081

; sizeof(CCam).
CamStride = 0x238

; Field offsets inside the active CCam.
OffsetAlphaSpeed   = 0xB0
OffsetBetaSpeed    = 0xC0
OffsetHorizontal   = 0xBC
OffsetVertical     = 0xAC
