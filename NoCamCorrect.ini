[Settings]
; Address of gLastTime2PlayerCameraWasOK in GTA SA 1.0 (TheCamera is at 0xB6F028).
; Change this to test other candidate addresses without recompiling.
TargetAddress = 0xB6EC24

; How often to refresh the timestamp, in milliseconds.
; Smaller = more aggressive. Do not go below 5 or the game may slow down.
IntervalMs = 10

; Set to 0 to disable the plugin at runtime without uninstalling.
Enabled = 1
